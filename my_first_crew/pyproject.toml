[project]
name = "my_first_crew"
version = "0.1.0"
description = "my_first_crew using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[litellm,tools]>=1.15.22,<2.0.0",
    "groq>=1.7.0",
    "litellm>=1.102.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["agents", "crew.jsonc", "tools", "knowledge", "skills"]

[tool.crewai]
type = "crew"
definition = "crew.jsonc"
project_id = "fd94c0b7-d9ec-4821-8b06-8d43db5e7f8a"
