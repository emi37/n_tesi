[project]
name = "tesi_prototipo_per_interazione_con_db"
version = "0.1.0"
description = "TESI_prototipo_per_interazione_con_db_ using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]>=1.15.22,<2.0.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["agents", "crew.jsonc", "tools", "knowledge", "skills"]

[tool.crewai]
type = "crew"
definition = "crew.jsonc"
project_id = "9cef0256-0f65-4299-97ee-4f95f78a2f17"
